<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Services | VIRAT Digital Ecosystem</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.chat-window{height:320px;overflow-y:auto;border:1px solid #1e3d54;border-radius:12px;padding:15px;background:#010710;display:flex;flex-direction:column;gap:12px;margin:15px 0}
.msg{padding:10px 14px;border-radius:12px;max-width:80%;font-size:14px;line-height:1.4}
.msg.user{background:#005288;color:#fff;align-self:flex-end}
.msg.ai{background:#042138;color:#23e8ff;border:1px solid #145980;align-self:flex-start}
.input-group{display:flex;gap:10px}
.input-group input{flex:1;padding:12px;border-radius:25px;border:1px solid #285573;background:#020d1a;color:#fff;outline:none}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="../index.html"><span class="flag">🇮🇳</span><span><strong>VIRAT DIGITAL ECOSYSTEM</strong><small>AI Workspace</small></span></a><nav class="nav" id="nav"><a href="../index.html">Home</a><a href="../index.html#panels">Panels</a></nav><button class="menu" id="menu">☰</button></header>
<main>
<div class="subpage-box">
<h2>🤖 VIRAT AI Workspace</h2>
<p style="color:var(--muted);font-size:14px">संवादात्मक एआई, कोड ऑटोमेशन व स्मार्ट उत्तर प्राप्त करें।</p>
<div class="chat-window" id="chat"><div class="msg ai">नमस्ते! मैं VIRAT AI असिस्टेंट हूँ। आप मुझसे क्या पूछना चाहते हैं?</div></div>
<div class="input-group"><input type="text" id="userInput" placeholder="यहाँ अपना सवाल लिखें..."><button class="btn primary" onclick="processAI()">पूछें →</button></div>
<br><a class="btn" href="../index.html">← मुख्य पृष्ठ पर लौटें</a>
</div>
</main>
<script src="../js/script.js"></script>
<script>
function processAI(){
    const input = document.getElementById('userInput'), chat = document.getElementById('chat');
    const txt = input.value.trim(); if(!txt) return;
    let uMsg = document.createElement('div'); uMsg.className='msg user'; uMsg.textContent=txt; chat.appendChild(uMsg);
    input.value='';
    setTimeout(()=>{
        let aMsg = document.createElement('div'); aMsg.className='msg ai';
        aMsg.textContent=`VIRAT AI: "${txt}" पर प्रोसेस किया जा रहा है... (AI Live Connection Active)`;
        chat.appendChild(aMsg); chat.scrollTop = chat.scrollHeight;
    }, 600);
}
</script>
</body></html>
